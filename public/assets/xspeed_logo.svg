<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="100%" stop-color="#C45B2A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2123" />
      <stop offset="100%" stop-color="#1A0D0E" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#C45B2A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Back wing feathered streaks -->
    <path d="M 6 22 Q 22 22 36 34 L 30 38 Q 18 28 6 28 Z" fill="url(#orangeGrad)" opacity="0.85"/>
    <path d="M 12 36 Q 26 36 38 46 L 32 50 Q 20 42 12 42 Z" fill="url(#orangeGrad)" opacity="0.95"/>
    <path d="M 16 50 Q 26 50 36 58 L 30 62 Q 22 56 16 56 Z" fill="url(#orangeGrad)"/>

    <!-- Dark Carbon Diagonal Leg of X -->
    <path d="M 52 14 L 68 14 L 34 66 L 18 66 Z" fill="url(#darkGrad)"/>

    <!-- Dynamic Orange Main Swoosh Leg of X with Forward Arrow -->
    <path d="M 22 20 C 38 20 54 36 68 56 L 60 66 C 48 48 36 32 22 30 Z" fill="url(#orangeGrad)"/>
    <path d="M 32 66 L 76 18 L 88 18 L 44 66 Z" fill="url(#goldGrad)"/>
    
    <!-- Forward Speed Chevron Arrow -->
    <path d="M 64 34 L 84 28 L 74 46 L 70 38 L 54 44 Z" fill="url(#orangeGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(112, 10)">
    <!-- Wordmark XSPEED -->
    <text x="0" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="42" letter-spacing="-1.5" fill="#251516">
      X<tspan fill="#C45B2A">SPEED</tspan>
    </text>
    <!-- Subtitle EXPRESS LOGISTICS -->
    <text x="2" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="800" font-size="11.5" letter-spacing="4.5" fill="#C45B2A">
      EXPRESS LOGISTICS
    </text>
  </g>
</svg>
