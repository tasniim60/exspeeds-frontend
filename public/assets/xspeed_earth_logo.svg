<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="100%" stop-color="#C45B2A" />
    </linearGradient>
    <linearGradient id="textDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D191B" />
      <stop offset="100%" stop-color="#1A0D0E" />
    </linearGradient>
    <clipPath id="globeDome">
      <path d="M 30 130 A 130 130 0 0 1 290 130 Z" />
    </clipPath>
  </defs>

  <!-- Earth Globe Hemisphere -->
  <g clip-path="url(#globeDome)">
    <!-- Base Globe Ocean -->
    <path d="M 30 130 A 130 130 0 0 1 290 130 Z" fill="url(#earthGrad)" />
    
    <!-- Clean Minimalist Continents (Europe, Africa, Americas silhouette) -->
    <!-- North America / Greenland -->
    <path d="M 65 55 Q 85 45 105 60 Q 95 85 75 80 Q 60 70 65 55 Z" fill="#FAF8F5" opacity="0.95"/>
    <path d="M 120 35 Q 135 30 145 42 Q 130 50 120 35 Z" fill="#FAF8F5" opacity="0.95"/>
    <!-- Europe -->
    <path d="M 140 55 Q 165 48 185 62 Q 175 78 150 72 Q 138 64 140 55 Z" fill="#FAF8F5" opacity="0.95"/>
    <path d="M 188 50 Q 215 45 240 68 Q 220 85 195 75 Z" fill="#FAF8F5" opacity="0.95"/>
    <!-- Africa / Middle East -->
    <path d="M 145 80 Q 180 76 195 95 Q 190 130 155 130 Q 135 110 145 80 Z" fill="#FAF8F5" opacity="0.95"/>
    <!-- South America -->
    <path d="M 85 92 Q 115 90 110 130 Q 80 130 85 92 Z" fill="#FAF8F5" opacity="0.95"/>

    <!-- Subtle Latitude / Longitude Speed Meridians -->
    <ellipse cx="160" cy="130" rx="90" ry="110" fill="none" stroke="#FAF8F5" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 3"/>
    <ellipse cx="160" cy="130" rx="45" ry="110" fill="none" stroke="#FAF8F5" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 3"/>
    <line x1="30" y1="130" x2="290" y2="130" stroke="#FAF8F5" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: XSPEED -->
  <text x="160" y="172" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="44" letter-spacing="-1.5" fill="url(#textDark)">
    XSPEED
  </text>

  <!-- Subtitle: FAST & SECURE -->
  <text x="160" y="200" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="800" font-style="italic" font-size="14" letter-spacing="4" fill="#C45B2A">
    FAST &amp; SECURE
  </text>
</svg>
