<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="navEarthGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#C45B2A" />
    </linearGradient>
    <clipPath id="navGlobeClipDark">
      <path d="M 40 46 A 80 80 0 0 1 200 46 Z" />
    </clipPath>
    <filter id="navGlowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFA040" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Earth Globe Dome -->
  <g clip-path="url(#navGlobeClipDark)" filter="url(#navGlowDark)">
    <path d="M 40 46 A 80 80 0 0 1 200 46 Z" fill="url(#navEarthGradDark)" />
    
    <!-- Continents in clean dark obsidian silhouette -->
    <path d="M 58 18 Q 72 12 86 22 Q 78 38 65 34 Z" fill="#251516" opacity="0.95"/>
    <path d="M 98 8 Q 108 5 115 13 Q 104 18 98 8 Z" fill="#251516" opacity="0.95"/>
    <path d="M 112 18 Q 130 13 144 23 Q 136 34 118 30 Z" fill="#251516" opacity="0.95"/>
    <path d="M 146 15 Q 165 12 182 27 Q 168 38 150 32 Z" fill="#251516" opacity="0.95"/>
    <path d="M 115 32 Q 140 29 152 42 Q 148 46 122 46 Z" fill="#251516" opacity="0.95"/>
    <path d="M 72 38 Q 94 36 90 46 L 70 46 Z" fill="#251516" opacity="0.95"/>

    <ellipse cx="120" cy="46" rx="55" ry="40" fill="none" stroke="#251516" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 2"/>
    <ellipse cx="120" cy="46" rx="28" ry="40" fill="none" stroke="#251516" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 2"/>
    <line x1="40" y1="46" x2="200" y2="46" stroke="#251516" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Typography XSPEED (Crisp White) -->
  <text x="120" y="58" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-style="italic" font-size="30" letter-spacing="-0.8" fill="#FFFFFF">
    XSPEED
  </text>

  <!-- Subtitle FAST & SECURE (Vibrant Orange) -->
  <text x="120" y="72" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="800" font-style="italic" font-size="9" letter-spacing="3" fill="#FFA040">
    FAST &amp; SECURE
  </text>
</svg>
